<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Блок 3: Совпадение № КП ↔ № заказа ↔ № прихода ДС</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=4">
</head>
<body>
  <main class="container">
    <h1 style="font-size:1.1rem;margin:0 0 12px;">Совпадение № КП ↔ № заказа ↔ № прихода ДС</h1>
    <section class="panel">
      <div class="panel-top">
        <div class="panel-top__row">
          <strong>Блок 3: Совпадение № КП ↔ № заказа ↔ № прихода ДС</strong>
        </div>
        <p style="margin:6px 0 0;color:var(--muted);font-size:0.86rem;">
          КП считается совпавшим, если номер его заказа (Блок 1) найден в номере счёта из назначения платежа прихода ДС (Блок 2).
        </p>
      </div>
      <div class="rules-panel__footer">
        <button id="loadBtn" type="button">Загрузить / обновить</button>
        <span id="statusLabel" style="margin-left:12px;color:var(--muted);font-size:0.88rem;"></span>
      </div>
      <div class="pay-match-wrap">
        <table class="pay-match-table">
          <thead>
            <tr>
              <th>№ КП</th>
              <th>№ заказа</th>
              <th>№ прихода ДС</th>
              <th>№ счёта из назначения платежа</th>
            </tr>
          </thead>
          <tbody id="blockBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const loadBtn = document.getElementById('loadBtn');
    const statusLabel = document.getElementById('statusLabel');
    const blockBody = document.getElementById('blockBody');

    const toNumDesc = (value) => {
      const n = Number.parseInt(String(value || '').replace(/\D+/g, ''), 10);
      return Number.isFinite(n) ? n : -1;
    };

    function render(data) {
      blockBody.innerHTML = '';
      const list = (data.matchTable || [])
        .filter((row) => row.match === 'СОВПАДЕНИЕ')
        .map((row) => ({
          kp: String(row.kpNum || '').trim(),
          order: String(row.orderNum || '').trim(),
          pay: String(row.payNum || '').trim(),
          purpose: String(row.purposeNum || '').trim(),
        }));
      list.sort((a, b) => toNumDesc(b.kp) - toNumDesc(a.kp));

      if (list.length) {
        list.forEach((r) => {
          const tr = document.createElement('tr');
          tr.classList.add('pm-match');
          const tdKp = document.createElement('td');
          const tdOrder = document.createElement('td');
          const tdPay = document.createElement('td');
          const tdPurpose = document.createElement('td');
          tdKp.textContent = r.kp;
          tdKp.classList.add('pm-match-cell');
          tdOrder.textContent = r.order;
          tdPay.textContent = r.pay || 'не определено';
          tdPurpose.textContent = r.purpose;
          tr.append(tdKp, tdOrder, tdPay, tdPurpose);
          blockBody.appendChild(tr);
        });
      } else {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 4;
        td.textContent = 'нет совпадений';
        td.classList.add('pm-empty');
        tr.appendChild(td);
        blockBody.appendChild(tr);
      }

      statusLabel.textContent =
        `Совпадений: ${list.length} | Заказы: ${data.ordersScanComplete ? 'полный скан' : 'неполный скан'}, ` +
        `Платежи: ${data.paymentsScanComplete ? 'полный скан' : 'неполный скан'}`;
    }

    const delay = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

    async function waitForRefresh() {
      while (true) {
        const resp = await fetch('/api/kp/refresh/stage4_4/status', { credentials: 'include' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const state = await resp.json();
        if (!state.running) return state;
        statusLabel.textContent = 'Проверка оплат выполняется...';
        await delay(2000);
      }
    }

    async function load() {
      loadBtn.disabled = true;
      loadBtn.textContent = 'Обновляю...';
      statusLabel.textContent = 'Запускаю проверку оплат...';
      blockBody.innerHTML = '';
      try {
        const resp = await fetch('/api/kp/refresh/stage4_4', {
          method: 'POST',
          credentials: 'include',
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const state = await waitForRefresh();
        if (!state.lastOk) throw new Error(state.lastError || 'Проверка оплат завершилась с ошибкой');
        render(state);
      } catch (err) {
        statusLabel.textContent = `Ошибка: ${err.message}`;
      } finally {
        loadBtn.disabled = false;
        loadBtn.textContent = 'Загрузить / обновить';
      }
    }

    loadBtn.addEventListener('click', load);
    load();
  </script>
</body>
</html>
